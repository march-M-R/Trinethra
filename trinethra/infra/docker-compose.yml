services:
  db:
    image: pgvector/pgvector:pg16
    container_name: trinethra-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: trinethra
      POSTGRES_USER: trinethra_user
      POSTGRES_PASSWORD: trinethra_pass
    ports:
      - "5432:5432"
    volumes:
      - trinethra_db_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trinethra_user -d trinethra"]
      interval: 5s
      timeout: 3s
      retries: 20

  model-service:
    build: ../services/model_service
    environment:
      MODELS_DIR: /models
    ports:
      - "8002:8002"
    volumes:
      - ../models:/models:ro

  automation-api:
    build: ../services/automation_api
    environment:
      MODEL_URL: http://model-service:8002
      BLOCK_CUTOFF: ${BLOCK_CUTOFF:-}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: trinethra
      DB_USER: trinethra_user
      DB_PASSWORD: trinethra_pass
    ports:
      - "8003:8003"
    depends_on:
      db:
        condition: service_healthy
      model-service:
        condition: service_started

  monitoring-service:
    build: ../services/monitoring_service
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: trinethra
      DB_USER: trinethra_user
      DB_PASSWORD: trinethra_pass
    ports:
      - "8004:8004"
    depends_on:
      db:
        condition: service_healthy

  explain-service:
    build: ../services/explain_service
    environment:
      MONITORING_BASE: http://monitoring-service:8004
    ports:
      - "8001:8001"
    depends_on:
      - monitoring-service

  ui:
    build:
      context: ../../ui
      args:
        NEXT_PUBLIC_AUTOMATION_API_BASE: http://localhost:8003
        NEXT_PUBLIC_EXPLAIN_API_BASE: http://localhost:8001
    ports:
      - "3000:3000"
    depends_on:
      - automation-api
      - explain-service

volumes:
  trinethra_db_data:
